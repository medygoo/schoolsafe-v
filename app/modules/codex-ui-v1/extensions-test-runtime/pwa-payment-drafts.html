<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brouillons de paiements | SchoolSafe</title><link rel="manifest" href="/schoolsafe.webmanifest"><link rel="stylesheet" href="/pwa-payment-drafts.css"><script defer src="/pwa-payment-vault.js"></script><script defer src="/pwa-payment-drafts.js"></script><script defer src="/pwa-client.js"></script></head>
<body><main><header><img src="/schoolsafe-pwa-192.png" width="48" height="48" alt="SchoolSafe"><h1>Brouillons de paiements</h1><a href="/Modules.php?modname=Student_Billing/StudentPayments.php">Retour</a></header>
<p id="connection" role="status"></p><p>Phrase perdue : brouillons locaux inaccessibles.</p>
<form id="unlock"><label for="vault">Espace local</label><select id="vault"></select><label for="passphrase">Phrase de deverrouillage</label><input id="passphrase" type="password" minlength="12" required autocomplete="off"><button type="submit">Deverrouiller</button></form>
<section id="workspace" hidden><div class="actions"><button id="lock" type="button">Verrouiller</button><button id="check" type="button">Verifier la session</button></div>
<form id="draft"><label for="student">Identifiant de l'eleve</label><input id="student" type="number" readonly required><label for="amount">Montant <span id="currency"></span></label><input id="amount" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" required maxlength="12"><label for="date">Date du paiement</label><input id="date" type="date" required><label for="comment">Objet du paiement</label><input id="comment" type="text" maxlength="250" required><button type="submit">Enregistrer le brouillon</button></form>
<h2>Brouillons locaux</h2><ul id="drafts"></ul></section><p id="state" role="status"></p></main></body></html>
