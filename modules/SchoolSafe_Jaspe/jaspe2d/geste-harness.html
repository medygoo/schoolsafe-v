<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>JASPE - banc de mesure des gestes</title>
<style>
  body{margin:0;background:#d2e8fd;font:14px/1.4 system-ui,sans-serif;color:#20252c}
  .jaspe-stage{position:fixed;left:0;top:0;width:320px;height:460px;overflow:hidden}
  .jaspe-stage img,.jaspe-stage canvas{display:block;max-width:100%}
  .jaspe-host{position:fixed;left:0;top:0;width:320px;height:460px}
  #report{position:fixed;left:340px;top:0;right:0;bottom:0;overflow:auto;padding:12px;white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace}
</style>
</head>
<body>
<pre id="report">mesure en cours…</pre>
<script type="module">
  // Le moteur avance sur requestAnimationFrame. Dans un navigateur sans vsync (mesure
  // automatisée) les images sont rares : on fournit un temps régulier pour que chaque geste
  // soit réellement dessiné et chronométré. L'onglet n'est jamais « actif » en mesure : le
  // moteur met l'animation en pause quand il est masqué, ce qui gèlerait le chronométrage.
  Object.defineProperty(document, 'hidden', {get: () => false});
  Object.defineProperty(document, 'visibilityState', {get: () => 'visible'});
  document.hasFocus = () => true;
  (() => {
    const queue = new Map();
    let ticket = 0;
    let virtual = 0;
    window.requestAnimationFrame = callback => {
      const id = ++ticket;
      queue.set(id, setTimeout(() => { queue.delete(id); virtual += 20; callback(virtual); }, 12));
      return id;
    };
    window.cancelAnimationFrame = id => {
      const timer = queue.get(id);
      if (timer) { clearTimeout(timer); queue.delete(id); }
    };
  })();

  const report = document.getElementById('report');
  const out = {status:'running', engine:null, available:0, unavailable:[], vocabulary:[], intents:[], actions:[], failures:[]};
  window.__harness = out;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  const {mountLiveCompanion} = await import('/modules/SchoolSafe_Jaspe/jaspe2d/modules/jaspe2d/live-companion.js?v=gestes-4');
  const {createPresentationController, INTENT_DEFINITIONS} = await import('/modules/SchoolSafe_Jaspe/jaspe2d/modules/jaspe2d/presentation-controller.js?v=gestes-4');

  // Un moteur neuf par mesure : le moteur met un geste en file d'attente quand un autre joue,
  // et une chaîne de mesures laisserait des gestes non mesurés (décalage d'un cran).
  async function freshEngine() {
    const stage = document.createElement('div');
    stage.className = 'jaspe-stage';
    const host = document.createElement('section');
    host.className = 'jaspe-host';
    document.body.append(stage, host);
    let journal = [];
    const observer = new MutationObserver(() => journal.push(stage.dataset.motion));
    observer.observe(stage, {attributes:true, attributeFilter:['data-motion']});
    let live = null;
    const presentation = createPresentationController({
      createPrimary: async ({isVisible}) => {
        live = await mountLiveCompanion(stage, host, {
          isVisible, isBust:() => false, activityTarget:host, idleLiveliness:.65,
          allowIdleMotion:() => presentation.getState().current.kind === 'idle',
          isTyping:() => false,
        });
        // Marqueur public du moteur actif, comme dans v12-rosario.js.
        host.dataset.jaspeEngine = 'v12';
        return {
          play: command => live.play(command.action, {intensity: command.intensity}),
          stop: () => live.stop(),
          destroy: () => { live.destroy(); host.dataset.jaspeEngine = 'webp'; },
        };
      },
      createFallback: () => ({play:() => true, stop:() => true}),
    });
    const mountStarted = performance.now();
    await presentation.mount({host, surface:'workspace-avatar', isVisible:() => true});
    const mountMs = Math.round(performance.now() - mountStarted);
    // Délai large : le premier geste d'un moteur neuf attend le décodage de ses photos.
    const clean = async (expected, limit = 20000) => {
      const started = performance.now();
      while (performance.now() - started < limit) {
        if (stage.dataset.motion === expected) return Math.round(performance.now() - started);
        await wait(25);
      }
      // Geste joué mais raté entre deux sondages : le journal en garde la trace.
      return journal.includes(expected) ? 0 : -1;
    };
    // Le moteur salue de la main peu après le montage et la boucle d'attente peut prendre la
    // main : une demande envoyée pendant un geste non interruptible est ignorée sans trace.
    // On attend donc le repos réel avant chaque mesure, signal d'activité compris.
    const settle = async () => {
      host.dispatchEvent(new Event('input'));
      await clean('idle', 10000);
      return stage.dataset.motion;
    };
    return {
      stage, host, live, presentation, mountMs,
      journal: () => journal.slice(),
      clean, settle,
      close: () => { presentation.destroy(); stage.remove(); host.remove(); observer.disconnect(); },
    };
  }

  try {
    const probe = await freshEngine();
    const allActions = probe.live.availableActions();
    out.engine = probe.host.dataset.jaspeEngine;
    out.available = allActions.length;
    out.unavailable = probe.live.unavailableActions();
    out.vocabulary = Object.keys(INTENT_DEFINITIONS);
    probe.close();

    // 1. Gestes demandés par la conversation : événement jaspe-motion -> présentation -> moteur.
    for (const kind of out.vocabulary) {
      const engine = await freshEngine();
      const rest = await engine.settle();
      const expected = INTENT_DEFINITIONS[kind].action;
      engine.host.addEventListener('jaspe-motion', event => {
        engine.presentation.dispatch({kind: event.detail.kind, source: 'conversation', replace: true});
      });
      engine.host.dataset.motionIntent = kind;
      engine.host.dispatchEvent(new CustomEvent('jaspe-motion', {detail: {kind}}));
      const ms = await engine.clean(expected, 6000);
      out.intents.push({kind, expected, ms, rest, mountMs: engine.mountMs, journal: engine.journal().slice(-8)});
      if (ms < 0) out.failures.push('intent:' + kind + '->' + expected + ' (journal ' + engine.journal().slice(0, 4).join('>') + ')');
      report.textContent = 'intention ' + out.intents.length + '/' + out.vocabulary.length + ' - ' + kind + ' -> ' + expected + ' (' + ms + ' ms)';
      engine.close();
    }

    // 2. Toutes les actions déclarées par le moteur, jouées depuis un moteur au repos.
    for (const id of allActions) {
      const engine = await freshEngine();
      const rest = await engine.settle();
      let accepted = false;
      try { accepted = (await engine.live.play(id, {intensity:.85})) !== false; } catch (_) { accepted = false; }
      const ms = await engine.clean(id, 6000);
      out.actions.push({id, accepted, ms, rest, mountMs: engine.mountMs, journal: engine.journal().slice(-8)});
      if (!accepted || ms < 0) out.failures.push('action:' + id + ' (accepte ' + accepted + ', journal ' + engine.journal().slice(0, 4).join('>') + ')');
      report.textContent = 'intention ' + out.intents.length + ' / action ' + out.actions.length + ' - ' + id + ' (' + ms + ' ms)';
      engine.close();
    }

    out.status = out.failures.length ? 'failed' : 'passed';
    report.textContent = JSON.stringify(out, null, 1);
  } catch (error) {
    out.status = 'error';
    out.error = String(error && error.stack || error);
    report.textContent = out.error;
  }
</script>
</body>
</html>
